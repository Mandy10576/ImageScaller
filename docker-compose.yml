services:
  postgres:
    image: postgres:15-alpine
    container_name: upscaler-postgres
    restart: always
    environment:
      POSTGRES_USER: upscaler_user
      POSTGRES_PASSWORD: upscaler_password
      POSTGRES_DB: upscaler_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upscaler_user -d upscaler_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: upscaler-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: upscaler-ai-service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - shared_uploads:/app/uploads
      - shared_outputs:/app/outputs

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upscaler-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://upscaler_user:upscaler_password@postgres:5432/upscaler_db?schema=public"
      DIRECT_URL: "postgresql://upscaler_user:upscaler_password@postgres:5432/upscaler_db"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: "http://ai-service:8000/upscale"
      UPLOAD_DIR: ./uploads
      OUTPUT_DIR: ./outputs
    ports:
      - "5000:5000"
    volumes:
      - shared_uploads:/app/uploads
      - shared_outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: upscaler-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://upscaler_user:upscaler_password@postgres:5432/upscaler_db?schema=public"
      DIRECT_URL: "postgresql://upscaler_user:upscaler_password@postgres:5432/upscaler_db"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: "http://ai-service:8000/upscale"
      UPLOAD_DIR: ./uploads
      OUTPUT_DIR: ./outputs
    volumes:
      - shared_uploads:/app/uploads
      - shared_outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upscaler-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  shared_uploads:
  shared_outputs:

